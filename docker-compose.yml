services:
  postgres:
    image: postgres:16-alpine
    container_name: claim-solution-postgres
    environment:
      POSTGRES_DB: claim_solution
      POSTGRES_USER: claim_solution
      POSTGRES_PASSWORD: claim_solution_local
    ports:
      - "5432:5432"
    volumes:
      - claim_solution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim_solution -d claim_solution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  claim_solution_postgres_data:
